---
name: Dependabot auto-merge

on: pull_request

# Dependabot-triggered runs get a read-only GITHUB_TOKEN by default, so the
# write scopes have to be requested explicitly for `gh pr merge` to work.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Majors stay manual: a green Lint run only proves the linters still
      # execute, not that the action's behaviour is unchanged.
      # --auto queues the merge behind the required status checks defined by
      # the "main: require Lint checks" ruleset; without those required checks
      # this would merge immediately.
      - name: Queue auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
