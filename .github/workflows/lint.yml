---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Everything here only reads the checkout.
permissions:
  contents: read

jobs:
  # shellcheck / yamllint / markdownlint / actionlint / prettier / secretlint
  # all live in bobstrange/gh-workflows and reach this repo through the moving
  # v1 tag. This repo's .yamllint.yml, .markdownlint-cli2.yaml,
  # .secretlintrc.json and package.json pins win over the shared fallbacks, so
  # the tooling is unchanged — only its definition moved. Reports as "lint / lint".
  lint:
    uses: bobstrange/gh-workflows/.github/workflows/lint.yml@v1
    with:
      # dot_zsh/**/*.zsh is zsh, not sh — shellcheck cannot parse it (SC2148,
      # SC2296). The zsh syntax check job below is what actually covers it.
      shellcheck_ignore_paths: dot_zsh

  # --- Repo-specific jobs (nothing shared can express these) ---

  zsh-syntax:
    name: zsh syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: |
          status=0
          while IFS= read -r -d '' f; do
            zsh -n "$f" || status=1
          done < <(find dot_zsh -name '*.zsh' -print0)
          exit "$status"

  chezmoi:
    # Renders every *.tmpl file. Runs on both OSes because dot_zshrc.tmpl,
    # dot_gitconfig.tmpl, plugins.toml.tmpl and ghostty/config.tmpl all branch
    # on .chezmoi.os — a Linux-only run would never evaluate the darwin side.
    name: chezmoi templates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # .chezmoi.toml.tmpl has no promptString calls, so init is non-interactive.
      # --source is per-invocation and is not written to the generated config,
      # so every command below has to repeat it.
      - name: Init chezmoi against this checkout
        run: chezmoi init --source="$GITHUB_WORKSPACE"
      # --exclude encrypted: private_dot_ssh/config.d/encrypted_work.conf.age
      # needs the age identity, which is not (and should not be) in CI.
      # -v so the log shows the rendered output; a silent exit 0 gives no
      # evidence that anything was actually processed.
      - name: Render templates
        run: |
          chezmoi apply --source="$GITHUB_WORKSPACE" \
            --dry-run --force --exclude encrypted -v

  nix:
    # Evaluation only (no build): catches typos and removed attribute names in
    # nix/packages.nix before they blow up a real `make nix-apply` on Ubuntu.
    name: nix eval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check flake metadata
        run: nix flake check --no-build "path:$GITHUB_WORKSPACE/nix"
      # flake check only shallowly touches the non-standard homeConfigurations
      # output, so force a full eval of each activation package as well.
      - name: Evaluate home-manager configurations
        run: |
          for cfg in "bob@ubuntu" "bob@wsl"; do
            echo "::group::$cfg"
            nix eval --raw \
              "path:$GITHUB_WORKSPACE/nix#homeConfigurations.\"$cfg\".activationPackage.drvPath"
            echo
            echo "::endgroup::"
          done
