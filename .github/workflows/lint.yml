---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: "--shell=bash --external-sources"
        with:
          ignore_paths: dot_zsh

  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ibiqlik/action-yamllint@v3

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24

  prettier:
    name: prettier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      # prettier is pinned in package.json, which the pre-commit hook resolves
      # too, so a commit made with --no-verify is checked against the exact
      # same binary here. Exclusions live in .prettierignore.
      - run: npm ci
      - run: npm run format:check

  secretlint:
    name: secretlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install --no-save secretlint @secretlint/secretlint-rule-preset-recommend
      - run: npx secretlint "**/*"

  zsh-syntax:
    name: zsh syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: |
          status=0
          while IFS= read -r -d '' f; do
            zsh -n "$f" || status=1
          done < <(find dot_zsh -name '*.zsh' -print0)
          exit "$status"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  chezmoi:
    # Renders every *.tmpl file. Runs on both OSes because dot_zshrc.tmpl,
    # dot_gitconfig.tmpl, plugins.toml.tmpl and ghostty/config.tmpl all branch
    # on .chezmoi.os — a Linux-only run would never evaluate the darwin side.
    name: chezmoi templates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # .chezmoi.toml.tmpl has no promptString calls, so init is non-interactive.
      # --source is per-invocation and is not written to the generated config,
      # so every command below has to repeat it.
      - name: Init chezmoi against this checkout
        run: chezmoi init --source="$GITHUB_WORKSPACE"
      # --exclude encrypted: private_dot_ssh/config.d/encrypted_work.conf.age
      # needs the age identity, which is not (and should not be) in CI.
      # -v so the log shows the rendered output; a silent exit 0 gives no
      # evidence that anything was actually processed.
      - name: Render templates
        run: |
          chezmoi apply --source="$GITHUB_WORKSPACE" \
            --dry-run --force --exclude encrypted -v

  nix:
    # Evaluation only (no build): catches typos and removed attribute names in
    # nix/packages.nix before they blow up a real `make nix-apply` on Ubuntu.
    name: nix eval
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check flake metadata
        run: nix flake check --no-build "path:$GITHUB_WORKSPACE/nix"
      # flake check only shallowly touches the non-standard homeConfigurations
      # output, so force a full eval of each activation package as well.
      - name: Evaluate home-manager configurations
        run: |
          for cfg in "bob@ubuntu" "bob@wsl"; do
            echo "::group::$cfg"
            nix eval --raw \
              "path:$GITHUB_WORKSPACE/nix#homeConfigurations.\"$cfg\".activationPackage.drvPath"
            echo
            echo "::endgroup::"
          done
