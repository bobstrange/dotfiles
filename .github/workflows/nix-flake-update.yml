---
name: Update flake.lock

# Keeping nixpkgs current used to mean running `nix flake update` by hand and
# pushing the result, which made whichever machine happened to run it the only
# thing that ever tested the new lock. Here CI updates the lock and the "nix
# build" check tests it, so the machines only have to apply it.
on:
  schedule:
    # Monday 09:00 JST. Landing at the start of the week means a failure has
    # somewhere to go before the next run.
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Nothing is written with GITHUB_TOKEN: pull requests it creates do not start
# workflow runs, which would leave the required checks pending forever and
# auto-merge waiting on them. The App token below does the writing instead.
permissions:
  contents: read

jobs:
  update:
    name: update flake.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update the lock file
        id: update
        working-directory: nix
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "flake.lock is already current; nothing to do."
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: automated/flake-lock
          PR_BODY: |
            Weekly `nix flake update`.

            The `nix build` check builds
            `homeConfigurations."bob@ubuntu".activationPackage` against this lock, so a
            package that evaluates but fails to build is caught here rather than on the
            first `make nix-apply` after merging.

            Merges itself once the required checks pass. If it fails instead, the
            failure is the signal — read the build log before touching the lock by hand.
        run: |
          set -euo pipefail

          # Commit as the app itself, so the noreply address resolves to the
          # bot account rather than showing up as an unknown author.
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add nix/flake.lock
          git commit -m "chore(nix): update flake.lock"
          # One branch reused every week, so an unmerged update is replaced
          # rather than piling a second pull request on top of it.
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Pull request already open; the force-push refreshed it."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(nix): update flake.lock" \
            --body "$PR_BODY"

          gh pr merge "$BRANCH" --auto --squash
