[tools]
node = "lts"
# Not in nixpkgs and not worth a per-OS split; the npm backend covers both.
"npm:vercel" = "latest"
ruby = "latest"
go = "latest"
python = "latest"
erlang = "28"
elixir = "1.18"

# Without this mise points GOBIN inside the versioned install dir, so every
# `go install` binary is thrown away on the next `mise upgrade`. false restores
# Go's own default, $GOPATH/bin (~/go/bin), which .zshenv puts on PATH.
[settings.go]
set_gobin = false

[settings.ruby]
compile = false
